services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: etf
      POSTGRES_PASSWORD: etf_demo_only
      POSTGRES_DB: etf
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - etf-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etf -d etf"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  etf-data:
